<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage - Admin Control</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #fff; width: 100%; max-width: 700px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #6d1b22; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: #555; }
        input[type="text"], input[type="password"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Kanit', sans-serif; font-size: 16px; box-sizing: border-box; }
        input[type="color"] { width: 100%; height: 40px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { width: 100%; background-color: #6d1b22; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 18px; font-family: 'Kanit', sans-serif; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #a82a35; }
        button.btn-secondary { background-color: #4CAF50; margin-bottom: 15px; }
        button.btn-secondary:hover { background-color: #45a049; }
        hr { border: 0; height: 1px; background: #eee; margin: 25px 0; }
        .box { background-color: #fcfcfc; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .checkbox-group input { width: 20px; height: 20px; cursor: pointer; }
        .display-link { display: block; text-align: center; margin-top: 10px; color: #0066cc; font-weight: 600; text-decoration: none; }
        .display-link:hover { text-decoration: underline; }
        .super-admin-box { border: 2px solid #ff9800; background-color: #fffaf0; }
        .logout-btn { background-color: #888; margin-top: 20px; }
        .logout-btn:hover { background-color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 🌟 ส่วนล็อกอิน (แก้ไขให้รับ Username ด้วย) -->
        <div id="login-section">
            <h2>เข้าสู่ระบบผู้ดูแล (Admin)</h2>
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" placeholder="กรุณาใส่ชื่อผู้ใช้งาน">
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <input type="password" id="password" placeholder="กรุณาใส่รหัสผ่าน">
            </div>
            <button onclick="checkLogin()">เข้าสู่ระบบ</button>
        </div>

        <div id="admin-section" style="display: none;">
            <h2>แผงควบคุม Digital Signage</h2>
            
            <div class="box">
                <!-- 🌟 ปุ่มนี้จะเห็นเฉพาะ Super Admin -->
                <button id="btn-create-branch" class="btn-secondary" onclick="createNewBranch()" style="display: none;">➕ สร้างสาขาใหม่</button>
                
                <div class="form-group">
                    <label for="branch-select">📌 เลือกร้าน/สาขาที่ต้องการตั้งค่า</label>
                    <select id="branch-select"></select>
                </div>
                <a id="display-url" class="display-link" href="#" target="_blank">🔗 เปิดหน้าจอแสดงผลของสาขานี้</a>
            </div>

            <!-- 🌟 ส่วนตั้งค่าบัญชี (เห็นเฉพาะ Super Admin) -->
            <div id="super-admin-controls" class="box super-admin-box" style="display: none;">
                <h4 style="color: #e65100; margin-top: 0; margin-bottom: 10px;">🛡️ ตั้งค่าบัญชีผู้ใช้สาขานี้ (Super Admin เท่านั้น)</h4>
                <div class="grid-2">
                    <div>
                        <label>Username (ห้ามซ้ำกัน)</label>
                        <input type="text" id="branch-username" placeholder="เช่น branch1">
                    </div>
                    <div>
                        <label>Password</label>
                        <input type="text" id="branch-password" placeholder="รหัสผ่านสำหรับสาขานี้">
                    </div>
                </div>
            </div>

            <hr>

            <h3>⚙️ ข้อมูลร้านและรูปลักษณ์</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>ชื่อร้าน/สาขา</label>
                    <input type="text" id="branch-name" placeholder="เช่น ห้างทองมณีภัณฑ์">
                </div>
                <div class="form-group">
                    <label>URL โลโก้ร้าน</label>
                    <input type="text" id="logo-url" placeholder="เช่น https://.../logo.png">
                </div>
            </div>

            <div class="grid-2 box">
                <div><label>สีพื้นหลัง</label><input type="color" id="color-bg" value="#FF0000"></div>
                <div><label>สีตัวอักษรหลัก</label><input type="color" id="color-text" value="#FFFFFF"></div>
                <div><label>สีกรอบป้าย</label><input type="color" id="color-border" value="#FFFF00"></div>
                <div><label>สีแถบตัววิ่ง</label><input type="color" id="color-marquee" value="#8B0000"></div>
            </div>

            <hr>

            <h3>📺 ควบคุมการแสดงผลหน้าจอ</h3>
            <div class="box">
                <div class="checkbox-group"><input type="checkbox" id="show-bar" checked><label>แสดงป้ายราคาทองคำแท่ง</label></div>
                <div class="checkbox-group"><input type="checkbox" id="show-ornament" checked><label>แสดงป้ายราคาทองรูปพรรณ</label></div>
                <div class="checkbox-group"><input type="checkbox" id="show-marquee" checked><label>แสดงแถบข้อความตัววิ่ง</label></div>
            </div>

            <hr>

            <h3>💰 โหมดราคาทอง</h3>
            <div class="form-group">
                <select id="mode-select" onchange="toggleMode()">
                    <option value="auto">ดึงราคาอัตโนมัติ (สมาคมค้าทองคำ)</option>
                    <option value="manual">กำหนดราคาเอง (Manual)</option>
                </select>
            </div>

            <div id="manual-inputs" class="box" style="display: none;">
                <h4 style="margin-top: 0; color: #6d1b22;">ราคาทองคำแท่ง 96.5%</h4>
                <div class="grid-2">
                    <div><label>รับซื้อ (บาท)</label><input type="number" id="bar-buy-input"></div>
                    <div><label>ขายออก (บาท)</label><input type="number" id="bar-sell-input"></div>
                </div>
                <h4 style="color: #6d1b22; margin-top: 15px;">ราคาทองรูปพรรณ 96.5%</h4>
                <div class="grid-2">
                    <div><label>รับซื้อ (บาท)</label><input type="number" id="orn-buy-input"></div>
                    <div><label>ขายออก (บาท)</label><input type="number" id="orn-sell-input"></div>
                </div>
            </div>

            <hr>

            <h3>📢 ข้อความตัววิ่ง</h3>
            <div class="form-group">
                <input type="text" id="marquee-input" placeholder="พิมพ์ข้อความที่นี่...">
            </div>

            <button id="save-btn" onclick="saveSettings()">💾 บันทึกและอัปเดตหน้าจอ</button>
            <button class="logout-btn" onclick="location.reload()">ออกจากระบบ</button>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
